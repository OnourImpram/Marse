name: Scholarly integrity monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-scholarly-integrity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarly-integrity-review
          path: verification/scholarly-integrity.json
          retention-days: 30
